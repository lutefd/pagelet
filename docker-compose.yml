services:
  pagelet:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PAGELET_API_KEY: ${PAGELET_API_KEY:?set PAGELET_API_KEY in .env}
      DATABASE_PATH: /app/data/pagelet.sqlite
      ORIGIN: ${PAGELET_ORIGIN:?set PAGELET_ORIGIN in .env}
      HOST: 0.0.0.0
      PORT: 3000
      BODY_SIZE_LIMIT: 2M
    expose:
      - "3000"
    volumes:
      - pagelet-data:/app/data
    networks:
      - pagelet-internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      pagelet:
        condition: service_healthy
    # Recommended: read the token from the root-owned file declared under `secrets` below.
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflared_token
    secrets:
      - cloudflared_token
    # Less secure alternative: remove `secrets` above, comment the token-file command,
    # and use the command below with CLOUDFLARED_TOKEN set in your ignored `.env` file.
    # The token will then be visible in the container configuration via `docker inspect`.
    # command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:?set CLOUDFLARED_TOKEN in .env}
    networks:
      - pagelet-internal
      - tunnel-egress
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  cloudflared_token:
    file: /etc/pagelet/cloudflared-token

volumes:
  pagelet-data:

networks:
  pagelet-internal:
    internal: true
  tunnel-egress:
